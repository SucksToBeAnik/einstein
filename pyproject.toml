[project]
name = "einstein"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.0",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.0",
    "pydantic-settings>=2.14.1",
    "typer>=0.25.1",
    "mlflow>=2.10.0",
]

[project.scripts]
einstein = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "models"]
sources = ["main.py"]
